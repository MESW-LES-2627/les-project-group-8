name: Stories

# A gallery with one GIF per user story: each test in frontend/e2e/*.story.ts is recorded and
# converted to stories/USn.gif on the screenshots branch, and stories/README.md lists them.
# Rewritten on each push to staging. A failed story is left out of the gallery and fails the run.
on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write # the screenshots branch

jobs:
  stories:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.2.0 # keep in sync with e2e.yml

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13" # keep in sync with backend-ci.yml
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r ../backend/requirements.txt

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0 # keep in sync with frontend-ci.yml

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22 # keep in sync with frontend-ci.yml
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium and ffmpeg
        run: |
          pnpm exec playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      # Each test saves its recording as stories/<test title>.webm.
      - name: Record the stories
        id: record
        continue-on-error: true
        run: STORIES=1 pnpm test:e2e

      - name: Publish
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          # Nothing recorded (the run crashed before any test): keep the old gallery.
          ls stories/*.webm > /dev/null 2>&1 || exit 0
          if git fetch origin screenshots; then
            git worktree add --detach "$RUNNER_TEMP/branch" FETCH_HEAD
          else
            git worktree add --orphan -b screenshots "$RUNNER_TEMP/branch"
          fi
          out=$RUNNER_TEMP/branch/stories
          rm -rf "$out"
          mkdir -p "$out"
          {
            echo '# Story gallery'
            echo
            echo "One GIF per user story, recorded from \`frontend/e2e/stories.story.ts\` at $GITHUB_SHA."
            echo 'Rewritten by `.github/workflows/stories.yml` on each push to `staging` and each manual run.'
          } > "$out/README.md"
          ls stories | sort -V | while IFS= read -r file; do
            title=${file%.webm} # shortcut: assumes every story test's title starts with "USn "; check it if a test breaks that.
            id=${title%% *}
            ffmpeg -nostdin -loglevel error -i "stories/$file" \
              -vf 'fps=8,scale=800:-1:flags=lanczos,split[a][b];[a]palettegen[p];[b][p]paletteuse' "$out/$id.gif"
            printf '\n## %s: %s\n\n![%s](%s.gif)\n' "$id" "${title#* }" "$id" "$id" >> "$out/README.md"
          done

          cd "$RUNNER_TEMP/branch"
          git add -A stories
          git diff --cached --quiet || git commit -m "Story gallery at $GITHUB_SHA"
          # A PR's screenshots run may have pushed since the fetch.
          for try in 1 2 3; do
            git push origin HEAD:screenshots && break
            [ "$try" = 3 ] && exit 1
            git pull --rebase origin screenshots
          done

      - name: Fail if a story failed
        if: steps.record.outcome == 'failure'
        run: exit 1
