name: E2E

# Playwright against a throwaway local Supabase (ADR 0005), so it needs no repo secrets.
on:
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - "supabase/**"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

# A new push to a PR cancels its older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      # Supabase's ports (supabase/config.toml) sit in Linux's ephemeral range (32768-60999): an outbound
      # connection can take one and fail `supabase start` with "address already in use". First step, so no
      # connection holds one yet; working-directory `.` because frontend/ is not checked out yet.
      - name: Reserve Supabase's ports
        working-directory: .
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=54320-54329

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.2.0 # keep in sync with screenshots.yml

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13" # keep in sync with backend-ci.yml
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r ../backend/requirements.txt

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0 # keep in sync with frontend-ci.yml

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22 # keep in sync with frontend-ci.yml
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e tests
        run: pnpm test:e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
