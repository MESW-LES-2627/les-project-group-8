name: Link and close issues from PR bodies

# GitHub reads `Closes #N` only on PRs into main, so PRs into other branches are linked here,
# and closed here once their commits are in staging, stacked PRs included (ADR 0006).
on:
  pull_request:
    types: [opened, edited, reopened, closed]
    branches-ignore: [main]

permissions:
  issues: write
  pull-requests: write

env:
  CLOSING_RE: '\b(close[sd]?|fix(e[sd])?|resolve[sd]?):? +#[0-9]+'

jobs:
  link:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Link each issue the body closes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_ID: ${{ github.event.pull_request.node_id }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          for n in $(grep -oiE "$CLOSING_RE" <<<"$BODY" | grep -oE '[0-9]+$' | sort -u); do
            # addCloseIssueReferences is not in GitHub's public reference, so a failure only warns.
            if ! gh api graphql -f query='mutation($issue:ID!,$pr:ID!){addCloseIssueReferences(input:{issueId:$issue,pullRequestIds:[$pr]}){clientMutationId}}' \
                -f issue="$(gh api "repos/$REPO/issues/$n" --jq .node_id)" -f pr="$PR_ID" >/dev/null; then
              echo "::warning::Could not link #$n to this PR."
            fi
          done

  close:
    if: github.event.action == 'closed' && github.event.pull_request.merged
    runs-on: ubuntu-latest
    outputs:
      issues: ${{ steps.close.outputs.issues }}
    steps:
      - name: Close each issue the bodies of this PR and its stack close
        id: close
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.ref }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          # Walk down the stack: PRs merged into this branch earlier reach staging with it. A whole-stack merge marks
          # members merged after the bottom PR, so each member's own run also checks its commit is in staging.
          echo "$PR $HEAD $SHA" >queue
          i=1
          while line=$(sed -n "${i}p" queue) && [ -n "$line" ]; do
            read -r pr head sha <<<"$line"
            status=$(gh api "repos/$REPO/compare/staging...$sha" --jq .status || true)
            if [[ $status == identical || $status == behind ]]; then echo "$pr" >>reached; fi
            if [ "$head" != main ]; then # a back-merge from main would walk every promotion PR
              gh pr list --repo "$REPO" --state merged --base "$head" --limit 100 --json number,headRefName,mergeCommit \
                --jq '.[] | "\(.number) \(.headRefName) \(.mergeCommit.oid)"' >>queue
            fi
            i=$((i + 1))
          done
          numbers=""
          for pr in $(cat reached 2>/dev/null); do
            for n in $(gh pr view "$pr" --repo "$REPO" --json body --jq .body | grep -oiE "$CLOSING_RE" | grep -oE '[0-9]+$' | sort -u); do
              gh issue close "$n" --repo "$REPO" --comment "Closed by #$pr, whose commits are in \`staging\`." \
                || echo "::warning::Could not close #$n."
              numbers+=" $n"
            done
          done
          numbers=$(tr ' ' '\n' <<<"$numbers" | sort -un)
          echo "issues=$(jq -cn '$ARGS.positional | map(tonumber)' --args $numbers)" >>"$GITHUB_OUTPUT"

  # Issues closed with GITHUB_TOKEN start no workflows, so close-epic.yml is called here.
  close-epics:
    needs: close
    if: needs.close.outputs.issues != '[]'
    strategy:
      max-parallel: 1 # two stories of one epic would both see it finished and close it twice
      matrix:
        issue: ${{ fromJSON(needs.close.outputs.issues) }}
    uses: ./.github/workflows/close-epic.yml
    with:
      issue: ${{ matrix.issue }}
