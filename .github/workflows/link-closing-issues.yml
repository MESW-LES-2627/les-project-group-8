name: Link PRs to the issues they close

# GitHub reads `Closes #N` only on PRs into main, so PRs into other branches are linked here (ADR 0006).
on:
  pull_request:
    types: [opened, edited, reopened]
    branches-ignore: [main]

permissions:
  issues: write
  pull-requests: write

jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - name: Link each issue the body closes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_ID: ${{ github.event.pull_request.node_id }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          for n in $(grep -oiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?):? +#[0-9]+' <<<"$BODY" | grep -oE '[0-9]+$' | sort -u); do
            # addCloseIssueReferences is not in GitHub's public reference, so a failure only warns.
            if ! gh api graphql -f query='mutation($issue:ID!,$pr:ID!){addCloseIssueReferences(input:{issueId:$issue,pullRequestIds:[$pr]}){clientMutationId}}' \
                -f issue="$(gh api "repos/$REPO/issues/$n" --jq .node_id)" -f pr="$PR_ID" >/dev/null; then
              echo "::warning::Could not link #$n to this PR."
            fi
          done
