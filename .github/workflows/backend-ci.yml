name: Backend CI

on:
  push:
    branches: [main, staging]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

# A new push to a PR cancels its older run; pushes to main/staging always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13" # keep in sync with PYTHON_VERSION in render.yaml
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v --cov --cov-report=html
        env:
          # Public by design (ADR 0003); lets tests/integration check that RLS
          # refuses direct REST access. The secret key is never given to CI.
          SUPABASE_URL: https://xtaralttpdpluhkffryk.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ziQkPqpJg3OdkQiIHtJfTQ_tuKv3e0F

      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Backend coverage (line and branch, report only)"
            echo "### Domain services"
            coverage report --format=markdown --include='pools/service.py,picks/service.py,scores/service.py'
            echo "### All files"
            coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-html
          path: backend/htmlcov
