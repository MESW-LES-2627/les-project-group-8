name: Backend CI

on:
  push:
    branches: [main, staging]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: les
          POSTGRES_PASSWORD: les
          POSTGRES_DB: les_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U les -d les_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13" # keep in sync with PYTHON_VERSION in render.yaml
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v
        env:
          TEST_DATABASE_URL: postgresql://les:les@127.0.0.1:5432/les_test
          # Public by design (ADR 0003); lets tests/integration check that RLS
          # refuses direct REST access. The secret key is never given to CI.
          SUPABASE_URL: https://xtaralttpdpluhkffryk.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ziQkPqpJg3OdkQiIHtJfTQ_tuKv3e0F
