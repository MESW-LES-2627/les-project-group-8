name: Frontend CI

on:
  push:
    branches: [main, staging]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

# A new push to a PR cancels its older run; pushes to main/staging always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0 # keep in sync with deploy.yml and deploy-staging.yml

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22 # keep in sync with deploy.yml and deploy-staging.yml
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No env vars: src/env.ts makes them optional at build time.
      - name: Type-check
        run: pnpm check

      - name: Build
        run: pnpm build
