openapi: 3.0.3
info:
  title: Friendly Pool App API
  description: >
    Iteration 1 API contract. Browsing pools is public; creating one requires a
    logged-in User, who becomes its creator and decider. Users are not created
    through the API: each Account gets its User when it signs up. Pools have two
    to ten ordered options and a radio/dropdown presentation, and each logged-in
    participant can save or replace exactly one pick per pool.
  version: 0.2.0

servers:
  - url: http://127.0.0.1:5000/api
    description: Local Flask development server
  - url: https://les-backend-staging.onrender.com/api
    description: Staging server on Render
  - url: https://les-backend.onrender.com/api
    description: Production server on Render

paths:
  /health:
    get:
      summary: Health check
      description: Confirms that Flask responds. Does not query Supabase or verify database readiness.
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    example: ok

  /me:
    get:
      summary: Who am I
      description: The logged-in User the access token belongs to.
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The current User.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/NoUserForAccount'

  /pools:
    get:
      summary: List all pools
      description: Fetches all created pools from the database, ordered by newest first.
      operationId: listPools
      responses:
        '200':
          description: A list of pools.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pool'
        '500':
          description: Server or database error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Create a new pool
      description: >
        Creates a multiple-choice question (a pool in this increment) with two to
        ten ordered options and a radio or dropdown presentation. The logged-in
        User (from the access token) is the creator and, for now, the decider. The
        body must not name a creator.
      operationId: createPool
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePoolRequest'
      responses:
        '201':
          description: Pool created and saved to the database.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pool'
        '400':
          description: Validation error (e.g., a creator_id in the body, missing fields, past deadline, or an invalid option list).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                creatorNamed:
                  value:
                    error: "Field 'creator_id' is not accepted: the creator is the logged-in user."
                wrongOutcomeCount:
                  value:
                    error: "A question must have between 2 and 10 unique, non-empty options."
                pastDeadline:
                  value:
                    error: "Field 'deadline' must be in the future."
                emptyFields:
                  value:
                    error: "Field 'name' cannot be empty."
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/NoUserForAccount'
        '500':
          description: Server or database error.
          content:
            application/json:

              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /pools/{pool_id}:
    get:
      summary: Get one pool
      description: Returns the pool, its options in authored order, and its derived status.
      operationId: getPool
      parameters:
        - $ref: '#/components/parameters/PoolId'
      responses:
        '200':
          description: The pool.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pool'
        '404':
          description: Unknown pool id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Pool not found."

  /pools/{pool_id}/picks:
    get:
      summary: Get the logged-in User's pick
      description: >
        Returns the logged-in User's saved pick for this pool, or null when they
        have not picked.
      operationId: getMyPick
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PoolId'
      responses:
        '200':
          description: The User's pick, or null.
          content:
            application/json:
              schema:
                type: object
                required:
                  - pick
                properties:
                  pick:
                    allOf:
                      - $ref: '#/components/schemas/Pick'
                    nullable: true
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/NoUserForAccount'
        '404':
          description: Unknown pool id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Pool not found."

    post:
      summary: Save or replace the logged-in User's pick
      description: >
        Saves exactly one option of this pool for the logged-in User. A later pick
        replaces the previous one instead of creating a second row. Picks are
        refused once the deadline has passed or the pool is resolved.
      operationId: savePick
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PoolId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavePickRequest'
      responses:
        '201':
          description: Pick saved or replaced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pick'
        '400':
          description: >
            Invalid pool or option; a user_id in the body; an option from another
            pool; a closed pool; or a body that is not a JSON object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                userNamed:
                  value:
                    error: "Field 'user_id' is not accepted: the participant is the logged-in user."
                unknownOutcome:
                  value:
                    error: "Field 'outcome_id' must be one of the pool's options."
                closedPool:
                  value:
                    error: "Picks are closed for this pool."
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/NoUserForAccount'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The logged-in Account's Supabase access token (ES256, audience "authenticated").

  parameters:
    PoolId:
      name: pool_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    AuthenticationRequired:
      description: Missing, malformed, expired, wrong-audience or forged access token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "Authentication required."
    NoUserForAccount:
      description: Valid access token, but its Account has no User.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "No user exists for this account."

  schemas:
    CreatePoolRequest:
      type: object
      description: >
        Must not contain creator_id (400): the creator is the logged-in User.
      required:
        - name
        - statement
        - deadline
        - options
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: Title of the pool.
          example: "Champions League Final"
        statement:
          type: string
          minLength: 1
          maxLength: 500
          description: The exact prediction statement being judged.
          example: "Real Madrid wins in 90 minutes."
        deadline:
          type: string
          format: date-time
          description: ISO-8601 UTC timestamp when the pool locks. Must be in the future.
          example: "2026-11-01T20:00:00Z"
        options:
          type: array
          description: Two to ten distinct, non-empty option labels, in the order they should be displayed.
          minItems: 2
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 100
          example:
            - "Yes, they win"
            - "No, draw or loss"
            - "Match cancelled"
        presentation:
          type: string
          enum:
            - radio
            - dropdown
          default: radio
          description: How the options are presented to participants. A dropdown starts with no answer selected.

    Pool:
      type: object
      required:
        - id
        - name
        - statement
        - deadline
        - status
        - presentation
        - creator
        - decider
        - options
        - winning_outcome_id
      properties:
        id:
          type: string
          format: uuid
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        name:
          type: string
          example: "Champions League Final"
        statement:
          type: string
          example: "Real Madrid wins in 90 minutes."
        deadline:
          type: string
          format: date-time
          example: "2026-11-01T20:00:00Z"
        status:
          type: string
          description: Derived on the backend from deadline and winning_outcome_id.
          enum:
            - OPEN
            - LOCKED
            - RESOLVED
          example: "OPEN"
        presentation:
          type: string
          enum:
            - radio
            - dropdown
          description: How the options are presented.
          example: "radio"
        creator:
          $ref: '#/components/schemas/UserSummary'
        decider:
          $ref: '#/components/schemas/UserSummary'
        options:
          type: array
          minItems: 2
          maxItems: 10
          items:
            $ref: '#/components/schemas/Outcome'
        winning_outcome_id:
          type: string
          format: uuid
          nullable: true
          description: Null until the decider resolves the pool.
          example: null
        created_at:
          type: string
          format: date-time
          description: Creation timestamp.
          example: "2026-10-19T20:00:00Z"

    Outcome:
      type: object
      required:
        - id
        - label
      properties:
        id:
          type: string
          format: uuid
          example: "11111111-2222-3333-4444-555555555551"
        label:
          type: string
          example: "Yes, they win"

    SavePickRequest:
      type: object
      description: >
        Must not contain user_id (400): the participant is the logged-in User.
      required:
        - outcome_id
      properties:
        outcome_id:
          type: string
          format: uuid
          description: Exactly one option id that belongs to this pool.
          example: "11111111-2222-3333-4444-555555555551"

    Pick:
      type: object
      required:
        - id
        - pool_id
        - user_id
        - outcome_id
        - created_at
      properties:
        id:
          type: string
          format: uuid
          example: "99999999-8888-7777-6666-555555555555"
        pool_id:
          type: string
          format: uuid
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        user_id:
          type: string
          format: uuid
          example: "00000000-0000-0000-0000-000000000001"
        outcome_id:
          type: string
          format: uuid
          example: "11111111-2222-3333-4444-555555555551"
        created_at:
          type: string
          format: date-time
          example: "2026-11-03T20:00:00Z"

    UserSummary:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
          description: The User's id, which is also its Account's id.
          example: "3f2b8c1e-4d5a-4e6f-9a7b-8c9d0e1f2a3b"
        name:
          type: string
          example: "Ana"

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: "A question must have between 2 and 10 unique, non-empty options."
